name: Release signed Android APK
# Push a tag like v0.8.1 (matching package.json "version") to build a release APK signed with YOUR release key
# and attach it to a GitHub Release. The app's "Check for updates" reads that release.
# Updates install over the old app and keep its data ONLY if every release uses the same key and a higher version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Release tag (e.g. v0.9.5)', required: true }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - name: Check tag matches package.json version
        run: |
          VER=$(node -p "require('./package.json').version")
          REF="${{ github.event.inputs.tag || github.ref_name }}"; test "v$VER" = "$REF" || { echo "ERROR: tag $REF but package.json version is $VER. Bump package.json and tag v$VER."; exit 1; }
          echo "VERSION=$VER" >> "$GITHUB_ENV"
      - name: Check signing secrets
        id: sec
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::notice::Signing secret $v is not set, so no APK is built here. The release APK is signed locally and attached by hand."
              echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Use the runner's Android SDK
        if: steps.sec.outputs.ok == 'true'
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
      - name: Install, check and test
        if: steps.sec.outputs.ok == 'true'
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm test
      - name: Build web app and Android project
        if: steps.sec.outputs.ok == 'true'
        run: |
          npm run build
          npx cap add android
          node scripts/native-assets.mjs android
          npx cap sync android
      - name: Compile unsigned release APK
        if: steps.sec.outputs.ok == 'true'
        working-directory: android
        run: bash ./gradlew --no-daemon assembleRelease --stacktrace
      - name: Align and sign (v1 + v2 + v3)
        if: steps.sec.outputs.ok == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          IN=android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="Prvlar-$VERSION.apk"
          "$BT/zipalign" -f -P 16 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$OUT" aligned.apk
          rm -f "$RUNNER_TEMP/release.jks" aligned.apk "$OUT.idsig"
          "$BT/apksigner" verify -v "$OUT" | grep -E "Verified using v[123] "
          "$BT/apksigner" verify --print-certs "$OUT" | grep -i "SHA-256" | head -1
          "$BT/aapt2" dump badging "$OUT" | grep -E "^package|sdkVersion"
          if "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$OUT" | grep -qi testOnly; then echo "ERROR: testOnly set"; exit 1; fi
          echo "APK=$OUT" >> "$GITHUB_ENV"
      - name: Show signing certificate (SHA-1, SHA-256)
        if: steps.sec.outputs.ok == 'true'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | grep -E "SHA-1|SHA-256"
      - uses: actions/upload-artifact@v4
        if: steps.sec.outputs.ok == 'true'
        with:
          name: Prvlar-android-release
          path: ${{ env.APK }}
      - name: Attach APK to the release (replaces the asset with the same name)
        if: steps.sec.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" "$APK" --clobber -R "$GITHUB_REPOSITORY"

# Publishes the PUBLIC web edition to GitHub Pages (Settings › Pages › Source: GitHub Actions).
# The app uses relative URLs (vite base './'), so it works at https://<user>.github.io/<repo>/ without changes.
name: Deploy website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: touch dist-web/.nojekyll && cp dist-web/index.html dist-web/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

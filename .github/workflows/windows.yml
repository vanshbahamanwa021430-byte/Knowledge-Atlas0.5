# Builds the PUBLIC Windows installer (Electron + NSIS) on Windows and uploads it as an artifact.
name: Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:win
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: KnowledgeAtlas-windows
          path: release-public/*.exe

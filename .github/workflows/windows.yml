# Builds the PUBLIC Windows installer (Electron + NSIS) on Windows and uploads it as an artifact.
name: Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag: { description: 'Release tag to attach the installer to (empty = none)', required: false, default: '' }
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        shell: bash
      - run: npm run package:win
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: Prvlar-windows
          path: |
            release-public/*.exe
            release-public/*.zip
      - name: Attach installer and portable zip to the release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" release-public/*.exe release-public/*-windows-x64.zip --clobber -R "$GITHUB_REPOSITORY"

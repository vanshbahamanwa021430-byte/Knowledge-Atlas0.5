name: Build Prvlar Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # unsigned personal build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Check source and run tests
        run: |
          npm run check
          npm test
      - name: Build web assets and NSIS installer
        run: npm run package:win
      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: Prvlar-Windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

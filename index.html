  <style>
    @font-face { font-family: 'Prvlar Script'; src: url('fonts/PinyonScript-latin.ttf') format('truetype'); font-display: swap; }
    #intro { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: radial-gradient(120% 90% at 30% 20%, #7A1A26 0%, #4A0E18 55%, #3A0912 100%); transition: opacity .35s ease; cursor: pointer; }
    #intro.out { opacity: 0; pointer-events: none; }
    #intro .intro-p { width: 148px; height: 148px; }
    #intro path[pathLength] { stroke-dasharray: 1; stroke-dashoffset: 1; animation: ip-draw .55s cubic-bezier(.5,0,.3,1) forwards; }
    #intro .s2 { animation-delay: .45s; } #intro .s3 { animation-delay: .9s; animation-duration: .3s; }
    #intro .spark { opacity: 0; transform-origin: 23.5px 83px; animation: ip-twinkle .5s 1.1s ease-out forwards; }
    #intro .intro-word { font: 46px/1 'Prvlar Script', 'Pinyon Script', cursive; color: #E7C27A; opacity: 0; animation: ip-fade .45s 1.3s ease forwards; background: linear-gradient(90deg, #D9A856, #F3D79A, #D9A856); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; background-size: 200% 100%; }
    #intro.hold .intro-word { animation: ip-fade .01s forwards, ip-shimmer 1.4s linear infinite; }
    #intro.rm path[pathLength] { stroke-dashoffset: 0; animation: none; } #intro.rm .spark, #intro.rm .intro-word { opacity: 1; animation: none; }
    @keyframes ip-draw { to { stroke-dashoffset: 0; } }
    @keyframes ip-twinkle { 0% { opacity: 0; transform: scale(.2) rotate(0); } 60% { opacity: 1; transform: scale(1.6) rotate(45deg); } 100% { opacity: 1; transform: scale(1) rotate(90deg); } }
    @keyframes ip-fade { to { opacity: 1; } }
    @keyframes ip-shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  </style>

<body>
  <div id="intro" aria-hidden="true">
    <svg class="intro-p" viewBox="0 0 100 100"><defs><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F3D79A"/><stop offset=".5" stop-color="#D9A856"/><stop offset="1" stop-color="#B9853A"/></linearGradient></defs><g fill="none" stroke="url(#ig)" stroke-linecap="round" stroke-linejoin="round"><path class="s1" pathLength="1" stroke-width="2.2" d="M41 55 C 31 58, 24 53, 27 46 C 31 36, 47 29, 60 27.5 C 76 25.5, 85 31, 81 40 C 77 49, 62 54, 49 52.5"/><path class="s2" pathLength="1" stroke-width="3.6" d="M66 25 C 63 40, 58 60, 50 73 C 44 83, 35 88, 26 84"/><path class="s3" pathLength="1" stroke-width="1.6" d="M60 27.5 C 69 24, 78 19.5, 86 17.5"/></g><path class="spark" fill="#F3D79A" d="M23.5 80.5c.3 1.6.8 2.1 2.4 2.4-1.6.3-2.1.8-2.4 2.4-.3-1.6-.8-2.1-2.4-2.4 1.6-.3 2.1-.8 2.4-2.4z"/></svg>
    <div class="intro-word">Prvlar</div>
  </div>
  <script>
  // Launch intro (0.9.8): plays at least once while the app loads behind it; holds with a shimmer if loading is slower; tap to skip.
  (function () {
    var el = document.getElementById('intro'); if (!el) return;
    var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; if (rm) el.classList.add('rm');
    var min = rm ? 250 : 1800, t0 = performance.now(), ready = false;
    function done() { if (el.dataset.done) return; el.dataset.done = '1'; el.classList.add('out'); setTimeout(function () { el.remove(); }, 380); }
    function check() { if (performance.now() - t0 < min) return; if (ready) done(); else el.classList.add('hold'); }
    window.__prvlarReady = function () { ready = true; setTimeout(check, Math.max(0, min - (performance.now() - t0))); };
    setTimeout(check, min);
    el.addEventListener('click', function () { min = 0; check(); });
    setTimeout(done, 12000);   // never block the app
  })();
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
